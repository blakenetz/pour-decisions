# Pull requests deploy to the single shared `dev` environment (latest push wins), then run the
# Playwright suite against it; pushes to main deploy `prod`. Each environment is one CDK stack,
# PourDecisionsWeb-<env> (infra/bin/web.ts).
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Fork PRs get neither secrets nor an OIDC token for the dev environment, so skip them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
      url: ${{ steps.deploy.outputs.url }}
    # One deploy per environment at a time; a newer queued run replaces an older queued one, and an
    # in-flight CloudFormation update is never cancelled halfway.
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'prod' || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for aws-actions/configure-aws-credentials
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # matches the Lambda runtime in infra/lib/web-stack.ts
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm package:lambda

      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::187864192245:role/pour-decisions-github-deploy
          aws-region: us-west-1

      - id: deploy
        working-directory: infra
        env:
          # Optional per-environment GitHub OAuth app (see infra/bin/web.ts).
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          pnpm run web:deploy -c env=${{ github.event_name == 'push' && 'prod' || 'dev' }} --outputs-file outputs.json
          echo "url=$(jq -r '.[].Url' outputs.json)" >> "$GITHUB_OUTPUT"

      # E2E runs in this job, not a separate one, so it holds the dev concurrency lock: another
      # PR can't redeploy dev between this deploy and its tests.
      - name: Install Playwright browser
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium

      # The suite's global setup seeds the test accounts; this role may only touch the tastings
      # table and only `dev` jobs can assume it (infra/lib/ci-stack.ts).
      - uses: aws-actions/configure-aws-credentials@v6
        if: github.event_name == 'pull_request'
        with:
          role-to-assume: arn:aws:iam::187864192245:role/pour-decisions-github-e2e
          aws-region: us-west-1

      - name: E2E against dev
        if: github.event_name == 'pull_request'
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          DYNAMODB_TABLE: pour-decisions-tastings
          PUBLIC_AWS_REGION: us-west-1
        run: pnpm test:e2e

      - name: Upload e2e traces
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
